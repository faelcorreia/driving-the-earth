name: tag

# Creates the vX.Y.Z tag when the workspace version on main has no tag yet, then
# dispatches the build workflow on that tag (tags pushed with GITHUB_TOKEN do not
# trigger other workflows by themselves).

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create tag and dispatch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; nothing to do."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run build.yml --ref "$tag"
